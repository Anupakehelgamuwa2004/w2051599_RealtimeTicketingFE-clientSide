<div class="centered-container">
  <div class="d-flex gap-2">
    <button type="button" class="btn btn-success btn-lg custom-btn btn-start" (click)="onStart()">
      <i class="fas fa-play"></i> Start
    </button>
    <button type="button" class="btn btn-danger btn-lg custom-btn btn-stop" (click)="onStop()">
      <i class="fas fa-stop"></i> Stop
    </button>
  </div>
</div>
